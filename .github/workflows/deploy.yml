name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set environment variables
        run: |
          echo "VITE_CONFIRMATION_SHEET_URL=${{ vars.VITE_CONFIRMATION_SHEET_URL }}" >> .env
          echo "VITE_CONFIRMATION_API_KEY=${{ secrets.VITE_CONFIRMATION_API_KEY }}" >> .env
          echo "VITE_SONG_SHEET_URL=${{ vars.VITE_SONG_SHEET_URL }}" >> .env
          echo "VITE_SONG_API_KEY=${{ secrets.VITE_SONG_API_KEY }}" >> .env
        shell: bash

      - name: Build
        run: npm run build
        env:
          VITE_CONFIRMATION_SHEET_URL: ${{ vars.VITE_CONFIRMATION_SHEET_URL }}
          VITE_CONFIRMATION_API_KEY: ${{ secrets.VITE_CONFIRMATION_API_KEY }}
          VITE_SONG_SHEET_URL: ${{ vars.VITE_SONG_SHEET_URL }}
          VITE_SONG_API_KEY: ${{ secrets.VITE_SONG_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4